name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: relayforge
          POSTGRES_USER: relayforge
          POSTGRES_PASSWORD: relayforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relayforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,postgres]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: alembic upgrade head
        env:
          RELAYFORGE_DATABASE_URL: postgresql+psycopg://relayforge:relayforge@localhost:5432/relayforge
      - run: pytest
        env:
          RELAYFORGE_TEST_POSTGRES_URL: postgresql+psycopg://relayforge:relayforge@localhost:5432/relayforge
